name: Release standalone build

# On every push to main: run the test suite, build a single self-contained
# HTML file (scripts/bundle-standalone.js — everything, vendor libs
# included, inlined as one file with no external assets), and publish it as
# a GitHub Release. Versioning is a plain incrementing counter (v1, v2, …),
# derived each run from the highest existing "vN" release tag — no semver.
on:
  push:
    branches: ["main"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Determine next version
        id: version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          last=$(gh release list --repo "$GITHUB_REPOSITORY" --limit 1000 --json tagName \
            --jq '[.[].tagName | select(test("^v[0-9]+$")) | ltrimstr("v") | tonumber] | max // 0')
          echo "tag=v$((last + 1))" >> "$GITHUB_OUTPUT"

      - name: Build standalone bundle
        run: node scripts/bundle-standalone.js --out dist/index.html

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ steps.version.outputs.tag }}" \
            dist/index.html \
            --repo "$GITHUB_REPOSITORY" \
            --title "${{ steps.version.outputs.tag }}" \
            --notes "Standalone single-file build (everything inlined, vendor libs included) of $GITHUB_SHA. Just open the downloaded index.html — no other files needed."
